<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #f9f9f7;
      --card: #fcfcfb;
      --ink: #0b0b0b;
      --ink-muted: #6b6a64;
      --border: #e1e0d9;
      --blue: #3b82f6;
      --red: #f43f5e;
      --green-bg: #ecfdf5;
      --green-ink: #047857;
      --red-bg: #fef2f2;
      --red-ink: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131211;
        --card: #1c1b19;
        --ink: #f2f1ee;
        --ink-muted: #a3a199;
        --border: rgba(255,255,255,0.12);
        --green-bg: rgba(4,120,87,0.18);
        --green-ink: #34d399;
        --red-bg: rgba(185,28,28,0.18);
        --red-ink: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 20px 16px 40px;
    }
    h1 { font-size: 18px; margin: 4px 0 16px; }
    form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 420px;
      margin: 0 auto;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ink-muted);
      display: block;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      font-size: 16px;
      padding: 11px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ink);
    }
    input:focus, select:focus {
      outline: 2px solid var(--blue);
      outline-offset: -1px;
    }
    .type-toggle {
      display: flex;
      gap: 8px;
    }
    .type-toggle button {
      flex: 1;
      padding: 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ink-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .type-toggle button.active[data-type="Expense"] { background: var(--red); border-color: var(--red); color: #fff; }
    .type-toggle button.active[data-type="Income"] { background: var(--blue); border-color: var(--blue); color: #fff; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button.submit {
      margin-top: 4px;
      padding: 13px;
      border-radius: 9px;
      border: none;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button.submit:disabled { opacity: 0.6; cursor: default; }
    .banner {
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 13px;
      display: none;
    }
    .banner.show { display: block; }
    .banner.success { background: var(--green-bg); color: var(--green-ink); }
    .banner.error { background: var(--red-bg); color: var(--red-ink); }
    datalist { display: none; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      max-width: 420px;
      margin: 0 auto 16px;
    }
    .card h2 {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 12px;
    }
    .summary-stats { display: flex; gap: 10px; }
    .summary-stats .stat { flex: 1; text-align: center; }
    .summary-stats .stat .label { font-size: 11px; color: var(--ink-muted); margin-bottom: 2px; }
    .summary-stats .stat .value { font-size: 16px; font-weight: 700; }
    .summary-stats .stat.expenses .value { color: var(--red-ink); }
    .summary-stats .stat.income .value { color: var(--green-ink); }

    .recent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .recent-item:last-child { border-bottom: none; }
    .recent-item .meta { min-width: 0; }
    .recent-item .desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent-item .sub { font-size: 11px; color: var(--ink-muted); }
    .recent-item .amt { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .recent-item .amt.expense { color: var(--red-ink); }
    .recent-item .amt.income { color: var(--green-ink); }
    .empty-hint { font-size: 13px; color: var(--ink-muted); }
  </style>
</head>
<body>
  <h1>Add Transaction</h1>

  <div class="card">
    <h2>This Month</h2>
    <div class="summary-stats">
      <div class="stat income"><div class="label">Income</div><div class="value" id="statIncome">—</div></div>
      <div class="stat expenses"><div class="label">Expenses</div><div class="value" id="statExpenses">—</div></div>
      <div class="stat net"><div class="label">Net</div><div class="value" id="statNet">—</div></div>
    </div>
  </div>

  <form id="txnForm">
    <div id="banner" class="banner"></div>

    <div class="type-toggle">
      <button type="button" data-type="Expense" class="active">Expense</button>
      <button type="button" data-type="Income">Income</button>
    </div>

    <div>
      <label for="description">Description</label>
      <input id="description" type="text" autocomplete="off" required>
    </div>

    <div class="row">
      <div>
        <label for="amount">Amount</label>
        <input id="amount" type="number" step="0.01" min="0.01" inputmode="decimal" required>
      </div>
      <div>
        <label for="date">Date</label>
        <input id="date" type="date" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="category">Category</label>
        <input id="category" list="categoryList" autocomplete="off" placeholder="Other">
        <datalist id="categoryList"></datalist>
      </div>
      <div>
        <label for="account">Account</label>
        <input id="account" list="accountList" autocomplete="off" placeholder="Primary">
        <datalist id="accountList"></datalist>
      </div>
    </div>

    <div>
      <label for="notes">Notes (optional)</label>
      <input id="notes" type="text" autocomplete="off">
    </div>

    <button type="submit" class="submit" id="submitBtn">Add Transaction</button>
  </form>

  <div class="card">
    <h2>Recent</h2>
    <div id="recentList"><div class="empty-hint">Loading…</div></div>
  </div>

  <script>
    const form = document.getElementById('txnForm');
    const banner = document.getElementById('banner');
    const submitBtn = document.getElementById('submitBtn');
    const typeButtons = document.querySelectorAll('.type-toggle button');
    let currentType = 'Expense';

    document.getElementById('date').valueAsDate = new Date();

    typeButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        currentType = btn.dataset.type;
        typeButtons.forEach((b) => b.classList.toggle('active', b === btn));
      });
    });

    google.script.run.withSuccessHandler((opts) => {
      const catList = document.getElementById('categoryList');
      const acctList = document.getElementById('accountList');
      opts.categories.forEach((c) => {
        const opt = document.createElement('option');
        opt.value = c;
        catList.appendChild(opt);
      });
      opts.accounts.forEach((a) => {
        const opt = document.createElement('option');
        opt.value = a;
        acctList.appendChild(opt);
      });
    }).getFormOptions();

    const money = (n) => '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });

    function renderSummary(data) {
      document.getElementById('statIncome').textContent = money(data.income);
      document.getElementById('statExpenses').textContent = money(data.expenses);
      document.getElementById('statNet').textContent = money(data.net);

      const list = document.getElementById('recentList');
      if (!data.recent.length) {
        list.innerHTML = '<div class="empty-hint">No transactions yet.</div>';
        return;
      }
      list.innerHTML = data.recent.map((r) => {
        const isExpense = r.type === 'Expense';
        const sign = isExpense ? '−' : '+';
        return '<div class="recent-item">'
          + '<div class="meta">'
          + '<div class="desc">' + escapeHtml(r.description) + '</div>'
          + '<div class="sub">' + escapeHtml(r.date) + (r.category ? ' · ' + escapeHtml(r.category) : '') + '</div>'
          + '</div>'
          + '<div class="amt ' + (isExpense ? 'expense' : 'income') + '">' + sign + money(r.amount) + '</div>'
          + '</div>';
      }).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function loadSummary() {
      google.script.run.withSuccessHandler(renderSummary).getSummary();
    }
    loadSummary();

    function showBanner(kind, message) {
      banner.textContent = message;
      banner.className = 'banner show ' + kind;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving…';
      banner.className = 'banner';

      const payload = {
        date: document.getElementById('date').value,
        description: document.getElementById('description').value,
        amount: document.getElementById('amount').value,
        type: currentType,
        category: document.getElementById('category').value,
        account: document.getElementById('account').value,
        notes: document.getElementById('notes').value,
      };

      google.script.run
        .withSuccessHandler(() => {
          showBanner('success', 'Added — it will show up in the app on the next sync.');
          document.getElementById('description').value = '';
          document.getElementById('amount').value = '';
          document.getElementById('notes').value = '';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Add Transaction';
          loadSummary();
        })
        .withFailureHandler((err) => {
          showBanner('error', err.message || String(err));
          submitBtn.disabled = false;
          submitBtn.textContent = 'Add Transaction';
        })
        .submitTransaction(payload);
    });
  </script>
</body>
</html>
